name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    # macos-15 = Xcode 16 / Swift 6.x (Apple Silicon, native arm64). macos-14 ships Swift 5.10,
    # whose older concurrency checker + clang reject the modern Swift/Objective-C++ this builds
    # with locally; align CI to a current toolchain instead of contorting the source for 5.10.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build universal release (arm64 + x86_64)
        run: |
          zsh Scripts/make-app.sh
          lipo -archs dist/WeChatAntiRecall.app/Contents/MacOS/WeChatAntiRecallGUI
          lipo -archs dist/WeChatAntiRecall.app/Contents/Resources/wechat-antirecall
          lipo -archs dist/WeChatAntiRecall.app/Contents/Resources/libWeChatAntiRecallRuntime.dylib
